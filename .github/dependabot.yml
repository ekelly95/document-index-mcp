version: 2

# Keep commit-pinned GitHub Actions current. Every `uses:` in ci.yml and
# release.yml names a full 40-character SHA, which is the safe form and also the
# form that goes stale silently — nothing warns you that a pinned action is a
# year behind.
#
# The npm ecosystem was deliberately absent while this repository was private:
# a Dependabot pull request triggers ci.yml on `pull_request`, Actions was
# disabled, and an update no human and no machine can verify is worse than no
# update. It is here now because the repository is public and CI can prove it.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    # Let a new action release sit for a week before proposing it.
    cooldown:
      default-days: 7
    commit-message:
      prefix: "CI"
    labels:
      - dependencies

  # pnpm-workspace.yaml carries an `overrides` entry forcing fastembed onto a
  # patched `tar`, plus a matching patch file. Dependabot does not read either.
  # If it ever proposes a fastembed bump, `pnpm install` will fail with
  # UNUSED_PATCH rather than silently dropping the override — read the comment
  # in pnpm-workspace.yaml before merging that one.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    commit-message:
      prefix: "deps"
    labels:
      - dependencies

    # @types/node describes a particular Node, and this project supports the one
    # in `engines`: 22. Installing types for a newer Node lets code compile
    # against APIs that Node does not have, and CI cannot catch it — it
    # type-checks once against whatever types are installed, then runs the suite
    # on 22, where nothing yet reaches for the newer surface. The 22 -> 26 bump
    # passed every check for exactly that reason, which is the point: a green
    # run there says the present is fine and nothing about the failure it
    # installs for the next change. Raise the floor in `engines` first, then
    # this. Minor and patch updates still come through.
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
