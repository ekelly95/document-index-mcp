name: CI

# Pushes and pull requests use Linux only. Manual runs add Windows and macOS;
# use the full matrix before a release.
#
# Linux is not just the cheap default here — it is the only platform that can
# run the symlink-escape case in paths.test.ts, which an ordinary Windows
# session cannot create. The path jail is unproven on the development machine
# and proven here.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# The event is part of the group on purpose. A push superseding an older push on
# the same ref should cancel it; a manual full-matrix run should not. Without
# this they share one group, so dispatching the wider matrix after pushing
# cancels the push's own run — which leaves a cancelled ✗ beside every commit
# and looks exactly like a failure to anyone reading the Actions tab.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

# `persist-credentials: false` on every checkout, here and in release.yml.
# Checkout otherwise writes GITHUB_TOKEN into .git/config, where it stays for
# the whole job — and these jobs then run `pnpm install` and `pnpm test`, which
# execute this project's code and every dependency's. Nothing here needs the
# git credential: no job pushes, and release.yml's `gh` reads GH_TOKEN from the
# environment instead. It matters most there, where the token carries
# `contents: write`; it is set everywhere so a future job cannot inherit the
# weaker default by being written in the same shape as its neighbours.
env:
  # The embedding model is ~65MB and downloads from Hugging Face on
  # first use. Pinning the location lets actions/cache carry it between runs;
  # the test suite reads this variable (src/tools/tools.test.ts).
  DOCUMENT_INDEX_MODEL_CACHE: ${{ github.workspace }}/.ci-models

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Types
        run: pnpm exec tsc -p tsconfig.json --noEmit

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'workflow_dispatch' && '["ubuntu-latest", "windows-latest", "macos-latest"]' || '["ubuntu-latest"]') }}
        node-version: ["22", "24"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      # No model cache here on purpose. These jobs run against the stub
      # embedder, so they neither download the ~65 MB model nor load ONNX — the
      # end-to-end file was the only thing that did, and it cost eleven of the
      # suite's twelve seconds on every job. The real model is covered once, by
      # the `real-model` job below, rather than six times here.

      # better-sqlite3's install script is blocked in pnpm-workspace.yaml, so
      # this proves the shipped prebuilt binary loads on a platform that is not
      # the development machine. If it ever does not, that is the failure worth
      # catching, not a node-gyp fallback quietly papering over it.
      - run: pnpm install --frozen-lockfile
      - name: Native modules load
        run: node -e "require('better-sqlite3'); require('sqlite-vec'); console.log('ok')"

      # Never piped. A `| tail` once masked a failing test in this project.
      - name: Tests
        run: pnpm test

  # The half a stub cannot stand in for: the download, the pinned-hash check
  # and ONNX actually loading. Broken, that is "every new user's first ingest
  # fails", so it gates a merge like the rest — once, on one platform.
  real-model:
    runs-on: ubuntu-latest
    env:
      DOCUMENT_INDEX_TEST_REAL_MODEL: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: pnpm

      # Keyed on the model source rather than the lockfile, so a dependency bump
      # does not re-fetch it. A warm cache skips the download entirely, so bump
      # the suffix whenever fastembed changes where or how it fetches the model,
      # or that path goes untested here. The hash check runs either way.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.DOCUMENT_INDEX_MODEL_CACHE }}
          key: bge-small-en-v1.5-hf-${{ runner.os }}

      - run: pnpm install --frozen-lockfile
      - name: Tests, against the real model
        run: pnpm test

  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm pack

      # The published archive is runtime output plus four documents: the README,
      # the changelog, the security policy and the licence with its notice.
      # Tests, fixtures and TypeScript sources have no business in it, and the
      # `files` allowlist in package.json is what keeps them out. The required
      # list is asserted as well as the exclusions, because a document silently
      # dropped from the allowlist is the failure nobody notices.
      - name: No sources or tests escaped into the archive
        run: |
          contents=$(tar -tzf document-index-mcp-*.tgz)
          echo "$contents"
          if echo "$contents" | grep -E '\.test\.js|/testing/|\.ts$' | grep -v '\.d\.ts$'; then
            echo "::error::tests or TypeScript sources leaked into the package"
            exit 1
          fi
          for required in package/dist/index.js package/README.md package/CHANGELOG.md \
                          package/SECURITY.md package/LICENSE package/NOTICE.md; do
            echo "$contents" | grep -qx "$required" || {
              echo "::error::$required missing from the package"
              exit 1
            }
          done

      # A packed archive that cannot start is a release that cannot be
      # installed. This is the check the release plan asks for: prove it works
      # outside the development checkout.
      - name: Install from the archive and start against a scratch library
        run: |
          mkdir -p /tmp/scratch-install /tmp/scratch-library
          cd /tmp/scratch-install
          npm init -y >/dev/null
          npm install "$GITHUB_WORKSPACE"/document-index-mcp-*.tgz
          node -e "
            const { spawn } = require('node:child_process');
            const p = spawn(process.execPath,
              ['node_modules/document-index-mcp/dist/index.js', '--library=/tmp/scratch-library'],
              { stdio: ['pipe', 'pipe', 'inherit'] });
            const req = { jsonrpc: '2.0', id: 1, method: 'initialize', params: {
              protocolVersion: '2025-06-18', capabilities: {},
              clientInfo: { name: 'ci', version: '0' } } };
            p.stdin.write(JSON.stringify(req) + '\n');
            let buf = '';
            p.stdout.on('data', (d) => {
              buf += d;
              if (!buf.includes('\n')) return;
              const reply = JSON.parse(buf.split('\n')[0]);
              if (reply.result?.serverInfo?.name !== 'document-index-mcp') {
                console.error('unexpected server identity', reply);
                process.exit(1);
              }
              console.log('server started and identified itself correctly');
              p.stdin.end();
              process.exit(0);
            });
            setTimeout(() => { console.error('server did not answer initialize'); process.exit(1); }, 60000);
          "
