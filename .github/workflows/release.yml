name: Release

# A release is driven by a tag rather than a button, so what gets attached is
# always a named point in the history.
#
# ci.yml triggers on `push: branches`, which a tag push does not match. So the
# guards protecting the artefact are repeated here rather than assumed to have
# run — a tag can point at a commit that never reached main.
#
# One job rather than two. A sibling project splits build from publish because
# PyPI trusted publishing makes `id-token: write` itself the credential, and
# that has to be quarantined. Nothing here is published to a registry; the only
# extra privilege is `contents: write` to create the release, so splitting would
# buy nothing and cost two more actions to keep pinned.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  # Same key and location as ci.yml, so a release run reuses the cached model
  # rather than paying the 130MB download again.
  DOCUMENT_INDEX_MODEL_CACHE: ${{ github.workspace }}/.ci-models

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: pnpm
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.DOCUMENT_INDEX_MODEL_CACHE }}
          key: bge-small-en-v1.5-${{ runner.os }}

      - run: pnpm install --frozen-lockfile

      # A tag pointing at a commit whose package.json says something else is the
      # one mistake that cannot be corrected after the fact, because the release
      # is named by the tag and the archive is named by the version.
      - name: The tag names the version being released
        run: |
          version=$(node -p "require('./package.json').version")
          tag=${GITHUB_REF_NAME#v}
          if [ "$version" != "$tag" ]; then
            echo "::error::tag $tag does not match package.json version $version"
            exit 1
          fi

      # Never piped. A `| tail` once masked a failing test in this project.
      - name: Tests, on the exact commit being released
        run: pnpm test

      # `pnpm test` builds first, and it compiles the test files into dist/ as
      # well — which makes this a stricter check of the `files` allowlist than
      # ci.yml's, where pack runs against a build that never saw the tests.
      - run: pnpm pack

      - name: No sources or tests escaped into the archive
        run: |
          contents=$(tar -tzf document-index-mcp-*.tgz)
          echo "$contents"
          if echo "$contents" | grep -E '\.test\.js|/testing/|\.ts$' | grep -v '\.d\.ts$'; then
            echo "::error::tests or TypeScript sources leaked into the package"
            exit 1
          fi
          for required in package/dist/index.js package/README.md package/CHANGELOG.md \
                          package/SECURITY.md package/LICENSE package/NOTICE.md; do
            echo "$contents" | grep -qx "$required" || {
              echo "::error::$required missing from the package"
              exit 1
            }
          done

      # A packed archive that cannot start is a release that cannot be
      # installed. Same check ci.yml runs, for the same reason: prove it works
      # outside the development checkout.
      - name: Install from the archive and start against a scratch library
        run: |
          mkdir -p /tmp/scratch-install /tmp/scratch-library
          cd /tmp/scratch-install
          npm init -y >/dev/null
          npm install "$GITHUB_WORKSPACE"/document-index-mcp-*.tgz
          node -e "
            const { spawn } = require('node:child_process');
            const p = spawn(process.execPath,
              ['node_modules/document-index-mcp/dist/index.js', '--library=/tmp/scratch-library'],
              { stdio: ['pipe', 'pipe', 'inherit'] });
            const req = { jsonrpc: '2.0', id: 1, method: 'initialize', params: {
              protocolVersion: '2025-06-18', capabilities: {},
              clientInfo: { name: 'ci', version: '0' } } };
            p.stdin.write(JSON.stringify(req) + '\n');
            let buf = '';
            p.stdout.on('data', (d) => {
              buf += d;
              if (!buf.includes('\n')) return;
              const reply = JSON.parse(buf.split('\n')[0]);
              if (reply.result?.serverInfo?.name !== 'document-index-mcp') {
                console.error('unexpected server identity', reply);
                process.exit(1);
              }
              console.log('server started and identified itself correctly');
              p.stdin.end();
              process.exit(0);
            });
            setTimeout(() => { console.error('server did not answer initialize'); process.exit(1); }, 60000);
          "

      # The release notes are the changelog entry, so a version with no entry
      # cannot be released. That is the point: it is the only thing forcing the
      # changelog to stay current.
      - name: Publish the release, with its changelog entry as the notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./package.json').version")
          notes=$(awk -v want="## $version" '$0 == want { found = 1; next } /^## / && found { exit } found' CHANGELOG.md)
          if [ -z "$(echo "$notes" | tr -d '[:space:]')" ]; then
            echo "::error::CHANGELOG.md has no '## $version' entry"
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes "$notes" \
            document-index-mcp-*.tgz
