# pnpm 10+ blocks postinstall scripts by default, and this file — not the
# `pnpm.onlyBuiltDependencies` field in package.json, which is silently
# ignored — is where the allowlist lives.
#
# better-sqlite3 is deliberately FALSE. Its install script runs
# `prebuild-install || node-gyp rebuild`; the prebuild fetch fails for this
# Node ABI and it falls back to node-gyp, which needs Visual Studio. The
# package already ships a usable prebuilt binary, so skipping the script
# entirely is what actually works on this machine.
# tesseract.js is FALSE because its only install script is
# opencollective-postinstall — a donation banner, not a build step. The
# package is pure JS + prebuilt WASM and works without running anything.
allowBuilds:
  better-sqlite3: false
  onnxruntime-node: true
  tesseract.js: false
# fastembed pins `tar: ^6.2.0`, and 6.2.1 is the end of that line: twelve
# advisories against it, one critical, no patched 6.x to move to, and 2.1.0 is
# the latest fastembed there is. onnxruntime-node already pulls a clean tar 7
# into the tree, so this collapses the two copies onto the good one rather than
# adding anything.
#
# The override and the patch below are one change and must be removed together.
# tar 7 is ESM with no default export, so fastembed's `import tar from "tar"`
# stops being a runtime problem and becomes a link-time SyntaxError — the server
# would fail to start at all, for everyone, before any download. The patch makes
# it a namespace import, which resolves to a working `.x` under both 6 and 7.
#
# `pnpm install` throws UNUSED_PATCH the day fastembed moves off 2.1.0. That is
# the reminder to check whether its tar range has been fixed upstream and both
# of these can go.
overrides:
  fastembed>tar: ^7.5.22
patchedDependencies:
  fastembed@2.1.0: patches/fastembed@2.1.0.patch
